packages:
  - 'libs/*'
  - 'apps/*'
  - 'plugins/*'
allowBuilds:
  better-sqlite3: true
  esbuild: true
  nx: true
  sharp: true
minimumReleaseAgeExclude:
  - js-yaml@3.15.2 || 4.3.2
# Transitive-dependency pins for high-severity advisories that can't be
# cleared by bumping a direct dependency (Refs #290). Each entry documents
# why it's needed; remove once the upstream direct dependency naturally picks
# up a version that already satisfies it.
overrides:
  # cel-js -> chevrotain -> @chevrotain/{cst-dts-gen,gast} pull an unpatched
  # lodash-es (GHSA-r5fr-rjxr-66jc); cel-js is already at its latest release.
  lodash-es: ^4.17.24
  # @modelcontextprotocol/sdk -> ajv/ajv-formats pull an unpatched fast-uri
  # (GHSA-v39h-62p7-jpjc, GHSA-v2hh-gcrm-f6hx, GHSA-7p8r-x3mc-p8w7); the SDK's
  # own ajv dependency range (^8.17.1) is already satisfied by the resolved
  # ajv version, so only fast-uri needs pinning forward within ajv's own
  # `^3.0.1` dependency range.
  fast-uri: ^3.1.5
  # @modelcontextprotocol/sdk and @hono/node-server both pull an unpatched
  # hono (GHSA-88fw-hqm2-52qc); both declare `^4.x` ranges that a patched
  # 4.12.x release satisfies.
  hono: ^4.12.30
  # @modelcontextprotocol/sdk -> express-rate-limit pulls an unpatched
  # ip-address (GHSA-mwp4-54f8-5fhr); express-rate-limit's own dependency
  # range (^10.2.0) is already satisfied by a patched 10.3.x release.
  ip-address: ^10.3.1
  # Our own `glob` dependency (libs/core, apps/cli,
  # plugins/source-file-fingerprint) resolves minimatch@10.x, which pulls an
  # unpatched brace-expansion (GHSA-3jxr-9vmj-r5cp, GHSA-mh99-v99m-4gvg,
  # GHSA-rgw5-rvv9-x895). pnpm's override selector only supports one ">"
  # hop, so this is scoped to "minimatch@10" rather than the full
  # glob>minimatch>brace-expansion chain; that's still narrow, since
  # unrelated 1.x/2.x brace-expansion lines used elsewhere in the tree (by
  # older minimatch@3.x/5.x majors, a different and incompatible API) don't
  # match the "@10" selector and are left untouched. minimatch@10's own
  # dependency range (^5.0.2) is already satisfied by a patched 5.0.9
  # release.
  minimatch@10>brace-expansion: ^5.0.9
  # gray-matter (libs/core) is pinned to the js-yaml 3.x line (^3.13.1) and
  # can't take a 4.x release; it pulls an unpatched js-yaml
  # (GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj). A patched 3.15.x release
  # already satisfies gray-matter's own range.
  gray-matter>js-yaml: ^3.15.2
  # @markdoc/next.js (apps/website) pulls the js-yaml 4.x line and hits the
  # same two advisories on that line; a patched 4.3.x release already
  # satisfies its own range.
  '@markdoc/next.js>js-yaml': ^4.3.2
