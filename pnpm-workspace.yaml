packages:
  - 'libs/*'
  - 'apps/*'
  - 'plugins/*'
allowBuilds:
  better-sqlite3: true
  esbuild: true
  # Native exec returns errno without Node's process.execve abort path.
  koffi: true
  nx: true
  sharp: true
minimumReleaseAgeExclude:
  - js-yaml@3.15.2 || 4.3.2
  - glob@14.0.6
  - '@koromix/koffi-android-arm64@3.3.8'
  - '@koromix/koffi-android-x64@3.3.8'
  - '@koromix/koffi-darwin-arm64@3.3.8'
  - '@koromix/koffi-darwin-x64@3.3.8'
  - '@koromix/koffi-freebsd-arm64@3.3.8'
  - '@koromix/koffi-freebsd-ia32@3.3.8'
  - '@koromix/koffi-freebsd-x64@3.3.8'
  - '@koromix/koffi-linux-arm64@3.3.8'
  - '@koromix/koffi-linux-arm@3.3.8'
  - '@koromix/koffi-linux-ia32@3.3.8'
  - '@koromix/koffi-linux-loong64@3.3.8'
  - '@koromix/koffi-linux-ppc64@3.3.8'
  - '@koromix/koffi-linux-riscv64@3.3.8'
  - '@koromix/koffi-linux-x64@3.3.8'
  - '@koromix/koffi-openbsd-arm64@3.3.8'
  - '@koromix/koffi-openbsd-ia32@3.3.8'
  - '@koromix/koffi-openbsd-x64@3.3.8'
  - '@koromix/koffi-win32-arm64@3.3.8'
  - '@koromix/koffi-win32-ia32@3.3.8'
  - '@koromix/koffi-win32-x64@3.3.8'
  - koffi@3.3.8
# Keep security floors on the affected parent/major only. These overrides
# protect this workspace; published unbundled paths still depend on upstream
# ranges and direct package manifests, not on these consumer-local settings.
overrides:
  # cel-js's Chevrotain 11 parser uses lodash-es; preserve unrelated consumers.
  # GHSA-r5fr-rjxr-66jc.
  chevrotain@11>lodash-es: ^4.18.0
  '@chevrotain/cst-dts-gen@11>lodash-es': ^4.18.0
  '@chevrotain/gast@11>lodash-es': ^4.18.0
  # MCP's Ajv 8 URI parser: authority injection/host confusion and subsequent
  # normalization fixes (GHSA-qw65-cvwx-89v3, GHSA-58mr-gqgx-xq4g).
  ajv@8>fast-uri: ^3.1.9
  # MCP's HTTP transports share Hono 4. Keep both parents on the patched line.
  '@modelcontextprotocol/sdk@1>hono': ^4.13.11
  '@hono/node-server@2>hono': ^4.13.11
  # express-rate-limit 8 accepts the patched 10.x address parser.
  express-rate-limit@8>ip-address: ^10.7.4
  # gray-matter requires js-yaml 3; Markdoc requires 4. Keep both compatible
  # security floors for GHSA-52cp-r559-cp3m and GHSA-5p4m-2wfm-xmqj.
  gray-matter@4>js-yaml: ^3.15.2
  '@markdoc/next.js@0.5>js-yaml': ^4.3.2
